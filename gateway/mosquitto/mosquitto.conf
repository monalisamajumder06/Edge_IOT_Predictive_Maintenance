# =============================================================================
# Mosquitto MQTT Broker Configuration
# Subsystem: IoT + Backend + Dashboard (Member 3)
# Target Environment: Local Development (Windows) & Raspberry Pi 4 (Linux)
# Classification: [IMPLEMENTATION DECISION]
# =============================================================================

# Port and Network Binding
# Bind to all network interfaces on default MQTT port 1883
listener 1883 0.0.0.0

# Protocol Support
# Supports MQTT 5.0 and MQTT 3.1.1 clients
protocol mqtt

# Authentication
# Permitted for local development and initial gateway testing (Phase 2).
# Security / TLS / Authentication deferred to production deployment.
allow_anonymous true

# Logging Configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection Limits and Keepalive
max_keepalive 300
